<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Villa 21</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Villa 21">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>try{var t=localStorage.getItem("v21.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* Layout: iPhone app shell. Grouped iOS-style cards on a system background, 3 bottom tabs, floating Add Expense button, slide-up sheets. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E9E9EE; --ink:#111113; --muted:#6C6C72; --sep:rgba(60,60,67,.18);
  --primary:#111113; --primary-ink:#FFFFFF; --pos:#1E8E4A; --neg:#D7372F; --fun:#FFE9A8; --fun-ink:#5A3E00; --dot:#34C759;
  --scrim:rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F5F5F7; --muted:#9A9AA1; --sep:rgba(84,84,88,.6);
  --primary:#F5F5F7; --primary-ink:#000000; --pos:#3DD07A; --neg:#FF6B61; --fun:#4A3A0B; --fun-ink:#FFE08A; --dot:#30D158;
  --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F5F5F7; --muted:#9A9AA1; --sep:rgba(84,84,88,.6);
  --primary:#F5F5F7; --primary-ink:#000000; --pos:#3DD07A; --neg:#FF6B61; --fun:#4A3A0B; --fun-ink:#FFE08A; --dot:#30D158;
  --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 var(--font);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(170px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body.locked{overflow:hidden}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:2rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.small{font-size:.88rem}
.cap{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 4px 8px}

/* Brand */
.badge{display:inline-block;width:38px;height:38px;border-radius:50%;flex:none;vertical-align:middle}
.badge.lg{width:120px;height:120px}
.badge.sm{width:28px;height:28px;margin-right:10px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:1.15rem;letter-spacing:-.02em}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dot)}
.sync.wait i{background:#FF9F0A}
main{display:flex;flex-direction:column;gap:22px;padding-top:8px}

/* Cards & lists */
.card{background:var(--card);border-radius:16px;padding:16px}
.group{background:var(--card);border-radius:16px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;position:relative;width:100%;background:none;border:0;text-align:left;color:inherit}
.group .cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell.emoji-cell + .cell.emoji-cell::before{left:64px}
button.cell:active{background:var(--fill)}
.cell-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cell-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.emo{width:38px;height:38px;border-radius:11px;background:var(--fill);display:grid;place-items:center;font-size:1.25rem;flex:none}
.chev{color:var(--muted);flex:none}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px}
.sec-head h2{font-size:1.2rem}
.link{border:0;background:none;color:var(--ink);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px;font-size:.95rem}

/* Home */
.month-card{display:flex;flex-direction:column;gap:2px}
.month-card .total{font:700 2.4rem/1.1 var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bal{display:flex;flex-direction:column;gap:6px}
.bal .amt{font:700 1.7rem/1.15 var(--round);letter-spacing:-.02em}
.owe{display:flex;flex-direction:column;gap:8px;padding:12px 16px;position:relative}
.group .owe + .owe::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.owe-row{display:flex;align-items:center;gap:10px;min-height:36px}
.owe-names{flex:1;min-width:0;font-weight:600}
.owe-names span{color:var(--muted);font-weight:500;margin:0 4px}
.owe-amt{font-weight:700;font-variant-numeric:tabular-nums}
.paid-btn{border:0;background:var(--fill);color:var(--ink);font-weight:600;font-size:.85rem;border-radius:999px;padding:8px 12px;min-height:36px}
.fun{align-self:flex-start;background:var(--fun);color:var(--fun-ink);font-weight:700;font-size:.85rem;border-radius:999px;padding:5px 11px;transform-origin:left center}
.fun.anim{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.square{display:flex;align-items:center;gap:10px;padding:16px;color:var(--muted)}

/* Floating add button */
.add-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:31;width:min(calc(100% - 32px),420px);border:0;border-radius:16px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:1.1rem;min-height:56px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.add-fab:active{transform:translateX(-50%) scale(.98)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);max-width:500px;margin:0 auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;font-size:.7rem;font-weight:600;color:var(--muted);min-height:52px}
.tab[aria-current="page"]{color:var(--ink)}
.tab svg{width:26px;height:26px}

/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:36px;font-weight:600;font-size:.92rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

/* Month switcher */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar b{font-size:1.15rem}
.round-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--ink)}
.day{font-size:.82rem;font-weight:600;color:var(--muted);padding:14px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.empty{text-align:center;color:var(--muted);padding:32px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty .big-emo{font-size:2.4rem}
.kv{display:flex;justify-content:space-between;gap:12px;min-height:46px;align-items:center;padding:8px 16px;position:relative}
.group .kv + .kv::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.kv b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;margin:-4px 16px 10px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}

/* Forms */
.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 4px;display:flex;justify-content:space-between;align-items:baseline}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.inp{width:100%;border:0;background:var(--card);border-radius:12px;padding:14px 16px;font-size:17px;color:var(--ink);min-height:50px}
.inp::placeholder{color:var(--muted)}
.amount{display:flex;align-items:baseline;gap:8px;background:var(--card);border-radius:16px;padding:12px 18px}
.amount span{font:600 1.3rem var(--round);color:var(--muted)}
.amount input{flex:1;min-width:0;border:0;background:none;font:700 2.6rem/1.2 var(--round);letter-spacing:-.03em;color:var(--ink);padding:0;outline:none;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:999px;min-height:42px;padding:8px 14px;font-weight:600;font-size:.95rem;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.chip.add{border:1.5px dashed var(--sep);background:none;color:var(--muted)}
.who-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;position:relative;width:100%;border:0;background:none;color:inherit;text-align:left}
.group .who-row + .who-row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--sep);display:grid;place-items:center;flex:none;color:var(--primary-ink)}
.tick.on{background:var(--primary);border-color:var(--primary)}
.share{font-variant-numeric:tabular-nums;font-weight:600;min-width:90px;text-align:right}
.share input{width:96px;border:0;background:var(--fill);border-radius:9px;padding:8px 10px;text-align:right;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle i{position:absolute;inset:0;background:var(--fill);border-radius:999px;transition:background .2s}
.toggle i::after{content:"";position:absolute;width:27px;height:27px;top:2px;left:2px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked + i{background:var(--pos)}
.toggle input:checked + i::after{transform:translateX(20px)}
.split-msg{font-size:.88rem;font-weight:600;padding:0 4px}
.err{color:var(--neg);font-weight:600;font-size:.92rem;padding:0 4px}
.btn{border:0;border-radius:14px;min-height:52px;padding:12px 18px;font-weight:700;font-size:1.02rem;background:var(--card);color:var(--ink);width:100%}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--neg)}
.btn.solid-danger{background:var(--neg);color:#fff}
.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fixed{background:var(--card);border-radius:12px;padding:14px 16px;min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.banner{display:flex;flex-direction:column;gap:12px}
.banner .row2 .btn{min-height:46px}
.who-hint{font-size:.8rem;font-weight:600;color:var(--muted)}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:16px 16px 0 0;height:calc(100% - 12px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.open{transform:none}
.sheet.short{height:auto;max-height:90%}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 10px;gap:8px}
.sheet-head h2{font-size:1.05rem;text-align:center;white-space:nowrap}
.sheet-head .l{justify-self:start} .sheet-head .r{justify-self:end}
.text-btn{border:0;background:none;color:var(--ink);font-size:1.02rem;padding:8px 2px;min-height:44px}
.text-btn.strong{font-weight:700}
.sheet-body{flex:1;overflow:auto;padding:6px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.detail-amt{font:700 2.6rem/1.1 var(--round);letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums}
.detail-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px}
.detail-top .emo{width:60px;height:60px;border-radius:18px;font-size:2rem}

/* Onboarding */
.onb{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:24px;padding:24px 4px}
.onb-head{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.code-inp{font:600 1.15rem/1.3 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;text-align:center}

/* Toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--primary);color:var(--primary-ink);border-radius:14px;padding:12px 16px;font-weight:600;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center;animation:drop .3s ease-out}
.toast.bad{background:var(--neg);color:#fff}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="brand"><img class="badge" src="logo.png" alt="Villa 21 logo"><b>Villa 21</b></div>
    <div class="sync" id="sync"><i></i><span>Synced</span></div>
  </div>
</header>
<main id="main"></main>
<button class="add-fab" id="fab" data-act="add" hidden>+ Add Expense</button>
<nav class="tabs" id="tabs" hidden><div class="tabs-in">
  <button class="tab" data-to="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-to="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Expenses</button>
  <button class="tab" data-to="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* ============ Fixed setup ============ */
const VERSION = "1.1";
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const USERS = [
  { id: "regin", name: "Regin Shafi", short: "Regin" },
  { id: "tm", name: "TM", short: "TM" },
  { id: "rafi", name: "Rafi", short: "Rafi" }
];
const USER = Object.fromEntries(USERS.map(u => [u.id, u]));
const BASE_CATS = [
  { id: "food", label: "Food", emoji: "🍔" }, { id: "rent", label: "Rent", emoji: "🏠" }, { id: "groceries", label: "Groceries", emoji: "🛒" },
  { id: "electricity", label: "Electricity", emoji: "💡" }, { id: "water", label: "Water", emoji: "💧" }, { id: "internet", label: "Internet", emoji: "📶" },
  { id: "cleaning", label: "Cleaning", emoji: "🧹" }, { id: "maintenance", label: "Maintenance", emoji: "🔧" }, { id: "transport", label: "Transport", emoji: "🚕" },
  { id: "other", label: "Other", emoji: "📦" }
];
const UTILITIES = ["electricity", "water", "internet"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const LS = { user: "v21.user", code: "v21.code", theme: "v21.theme", cat: "v21.lastCat", lock: "v21.lock", pushKey: "v21.pushKey", pushBanner: "v21.pushBanner" };

/* ============ Small helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const monthOf = iso => String(iso || "").slice(0, 7);
const parseISO = iso => { const [y, m, d] = String(iso).split("-").map(Number); return new Date(y, m - 1, d || 1); };
const validISO = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || "") && isoOf(parseISO(iso)) === iso;
const monthLabel = key => { const [y, m] = key.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
const shiftMonth = (key, n) => { const [y, m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const dayLabel = iso => { const d = parseISO(iso); return `${pad(d.getDate())} ${MONTHS[d.getMonth()]}`; };
const nf = new Intl.NumberFormat("en-GB", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const nf2 = new Intl.NumberFormat("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const aed = f => "AED " + ((f || 0) % 100 ? nf2 : nf).format((f || 0) / 100);   // amounts are kept in fils: 1 AED = 100 fils
const toF = v => Math.round((+v || 0) * 100);
const num = v => { if (v === "" || v == null) return null; const n = typeof v === "number" ? v : parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : NaN; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
const nameOf = id => (USER[id] && USER[id].name) || "Someone";
const shortOf = id => (USER[id] && USER[id].short) || "Someone";
const CHEV = `<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg>`;
const CHECK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`;

/* ============ Split, balance and settle-up logic ============ */
// Equal split in fils; leftover fils go to the first people so the shares always add up exactly.
function equalSplit(totalF, ids) {
  const out = {}; if (!ids.length) return out;
  const base = Math.floor(totalF / ids.length); let rem = totalF - base * ids.length;
  ids.forEach(id => { out[id] = base + (rem > 0 ? 1 : 0); if (rem > 0) rem--; });
  return out;
}
// Net = total paid − total share, per person. Positive: should receive. Negative: owes.
function balances(list) {
  const net = Object.fromEntries(USERS.map(u => [u.id, 0]));
  list.forEach(e => {
    if (net[e.paidBy] !== undefined) net[e.paidBy] += e.amountF || 0;
    Object.entries(e.split || {}).forEach(([id, f]) => { if (net[id] !== undefined) net[id] -= f; });
  });
  return net;
}
// Fewest transfers: biggest debtor pays biggest creditor until everyone is square.
function settleUp(net) {
  const cred = Object.entries(net).filter(([, v]) => v > 0).map(([id, v]) => ({ id, v })).sort((a, b) => b.v - a.v);
  const debt = Object.entries(net).filter(([, v]) => v < 0).map(([id, v]) => ({ id, v: -v })).sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const amt = Math.min(debt[i].v, cred[j].v);
    if (amt > 0) out.push({ from: debt[i].id, to: cred[j].id, amountF: amt });
    debt[i].v -= amt; cred[j].v -= amt;
    if (!debt[i].v) i++; if (!cred[j].v) j++;
  }
  return out;
}

const funMsg = f => f > 10000 ? "💀 Aykk myre" : f > 5000 ? "😂 Aychirra paisaa" : "";

async function startFirebase(cfg) {
  const [appM, authM, fsM] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js")]);
  const F = { ...appM, ...authM, ...fsM };
  const { emulator, ...options } = cfg;   // emulator: only for the automated tests
  const app = F.initializeApp(options);
  let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch (e) { db = F.getFirestore(app); }
  const auth = F.getAuth(app);
  if (emulator) { F.connectAuthEmulator(auth, emulator.auth, { disableWarnings: true }); F.connectFirestoreEmulator(db, emulator.host, emulator.port); }
  const ready = new Promise(res => { const off = F.onAuthStateChanged(auth, u => { if (u) { off(); res(u); } }); });
  if (!auth.currentUser) F.signInAnonymously(auth).catch(() => {});
  let unsubs = [];
  const col = name => F.collection(db, "villas", villaKey(S.code), name);
  // Which person this phone belongs to, kept in Firebase so the rules can check every change.
  const device = () => F.doc(db, "villas", villaKey(S.code), "devices", auth.currentUser.uid);
  Store = {
    ts: () => F.serverTimestamp(),
    async whoAmI() {
      await ready;
      const snap = await F.getDoc(device());
      return snap.exists() ? snap.data().person : null;
    },
    async register(person) {
      await ready;
      try { await F.setDoc(device(), { person, at: F.serverTimestamp() }); return person; }
      catch (e) { const p = await this.whoAmI().catch(() => null); if (p) return p; throw e; }   // already set up as someone
    },
    async check(code) {
      await ready;
      const snap = await F.getDocFromServer(F.doc(db, "villas", villaKey(code), "meta", "villa"));
      return snap.exists();
    },
    async create(code) {
      await ready;
      await F.setDoc(F.doc(db, "villas", villaKey(code), "meta", "villa"), { name: "Villa 21", users: USERS.map(({ id, name }) => ({ id, name })), createdAt: F.serverTimestamp() });
    },
    async listen() {
      await ready;
      unsubs.forEach(u => u()); unsubs = [];
      unsubs.push(F.onSnapshot(col("expenses"), { includeMetadataChanges: true }, snap => {
        S.expenses = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        S.pending = snap.metadata.hasPendingWrites; S.loaded = true;
        render();
      }, err => { S.loaded = true; if (err && err.code === "permission-denied") toast("This phone can't open the Villa 21 data. Check the code in Settings.", "bad", 6000); render(); }));
      unsubs.push(F.onSnapshot(F.doc(db, "villas", villaKey(S.code), "meta", "categories"), snap => {
        S.customCats = (snap.exists() && Array.isArray(snap.data().list)) ? snap.data().list : []; render();
      }, () => {}));
    },
    save(id, obj) { return F.setDoc(F.doc(col("expenses"), id), obj); },
    remove(id) { return F.deleteDoc(F.doc(col("expenses"), id)); },
    saveCats(list) { return F.setDoc(F.doc(db, "villas", villaKey(S.code), "meta", "categories"), { list }); }
  };
}

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error("timeout"), { code: "unavailable" })), ms))]);
async function settleIdentity() {

    Store.whoAmI().then(p => { if (p && p !== S.me) adopt(p); else if (!p) Store.register(S.me).then(q => { if (q !== S.me) adopt(q); }).catch(() => {}); }).catch(() => {});
    return;
  }
  S.phase = "loading"; render();

  if (p && USER[p]) { adopt(p); return; }
  S.phase = "who"; render();
}

/* ============ Notifications ============ */
// Sent by the Supabase Edge Function "villa-notify" (see SETUP.md). The phone tells it about new
// expenses and payments; it notifies the other two people's phones.
let PUSH = null;   // { url, key } from config.js
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const PUSH_ERRORS = {
  not_set_up: "Notifications aren't set up yet. See “Notifications” in SETUP.md (the Supabase function “villa-notify”).",
  jwt_on: "In Supabase, turn off “Enforce JWT verification” for the villa-notify function, then try again.",
  offline: "You're offline. Connect to the internet and try again."
};
async function pushCall(body) {
  if (!navigator.onLine) throw Object.assign(new Error("offline"), { code: "offline" });
  let res;
  try { res = await fetch(PUSH.url, { method: "POST", headers: { "Content-Type": "application/json", apikey: PUSH.key }, body: JSON.stringify(body) }); }
  catch (e) { throw Object.assign(new Error("network"), { code: "offline" }); }
  const data = await res.json().catch(() => ({}));
  if (res.ok) return data;
  const code = res.status === 404 || data.error === "not_set_up" ? "not_set_up" : res.status === 401 ? "jwt_on" : "failed";
  throw Object.assign(new Error(data.error || data.message || `HTTP ${res.status}`), { code });
}
const pushErr = (e, fallback) => PUSH_ERRORS[e && e.code] || fallback;
function b64uToBytes(s) { const t = s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4); return Uint8Array.from(atob(t), c => c.charCodeAt(0)); }
async function swRegistration() { try { return (await navigator.serviceWorker.getRegistration()) || null; } catch (e) { return null; } }
async function pushKey() {
  let k = lsGet(LS.pushKey);
  if (!k) { k = (await pushCall({ action: "key" })).publicKey; lsSet(LS.pushKey, k); }
  return k;
}
function subInfo(sub) { const j = sub.toJSON(); return { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, userAgent: navigator.userAgent.slice(0, 300) }; }

// S.push: none | ios-browser | unsupported | denied | off | on
let pushSynced = false;
async function refreshPushState() {
  let state;
  if (S.demo || !PUSH || !S.me || !S.code) state = "none";
  else if (!pushSupported()) state = isIOS() && !isStandalone() ? "ios-browser" : "unsupported";
  else if (Notification.permission === "denied") state = "denied";
  else {
    const reg = (await swRegistration()) || await withTimeout(navigator.serviceWorker.ready, 4000).catch(() => null);
    if (!reg) state = isIOS() && !isStandalone() ? "ios-browser" : "unsupported";
    else {
      const sub = await reg.pushManager.getSubscription().catch(() => null);
      state = sub && Notification.permission === "granted" ? "on" : "off";
      // Keep the server's copy current (phones sometimes renew their subscription).
      if (state === "on" && !pushSynced) { pushSynced = true; pushCall({ action: "subscribe", code: S.code, person: S.me, subscription: subInfo(sub) }).catch(() => {}); }
    }
  }
  if (S.push !== state) { S.push = state; render(); }
  return state;
}
async function enablePush() {
  // Ask straight from the tap: iPhones only show the question in response to a tap.
  let permission;
  try { permission = await Notification.requestPermission(); } catch (e) { permission = Notification.permission; }
  if (permission !== "granted") {
    toast(permission === "denied" ? "Notifications are blocked. Allow them for Villa 21 in your phone's Settings › Notifications." : "Notifications weren't turned on.", "bad", 5000);
    await refreshPushState(); return;
  }
  try {
    const reg = await withTimeout(navigator.serviceWorker.ready, 10000);
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(await pushKey()) });
    await pushCall({ action: "subscribe", code: S.code, person: S.me, subscription: subInfo(sub) });
    pushSynced = true;
    toast("Notifications are on for this phone.");
  } catch (e) {
    toast(pushErr(e, "Couldn't turn on notifications. Try again."), "bad", 6000);
  }
  await refreshPushState();
}
async function disablePush() {
  try {
    const reg = await swRegistration(), sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await pushCall({ action: "unsubscribe", code: S.code, person: S.me, endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe().catch(() => {}); }
    toast("Notifications are off for this phone.");
  } catch (e) { toast("Couldn't turn off notifications.", "bad"); }
  pushSynced = false; await refreshPushState();
}

const SHEETS = [];
function openSheet({ title, left = "Cancel", right = "", short = false }) {
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const sh = document.createElement("div"); sh.className = "sheet" + (short ? " short" : ""); sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true"); sh.setAttribute("aria-label", title);
  sh.innerHTML = `<div class="grabber"></div><div class="sheet-head"><button class="text-btn l" data-sx="left">${esc(left)}</button><h2>${esc(title)}</h2><span class="r">${right ? `<button class="text-btn strong" data-sx="right">${esc(right)}</button>` : ""}</span></div><div class="sheet-body"></div>`;
  document.body.append(scrim, sh); document.body.classList.add("locked");
  void sh.offsetHeight; // apply the closed position first so the slide-up animates
  scrim.classList.add("open"); sh.classList.add("open");
  const api = {
    el: sh, body: $(".sheet-body", sh), onRight: null, refresh: null,
    close() { scrim.classList.remove("open"); sh.classList.remove("open"); const i = SHEETS.indexOf(api); if (i >= 0) SHEETS.splice(i, 1); if (!SHEETS.length) document.body.classList.remove("locked"); setTimeout(() => { scrim.remove(); sh.remove(); }, 320); }
  };

  SHEETS.push(api); return api;
}

}

function viewExpenses() {
  const list = S.expenses.filter(e => monthOf(e.date) === S.month).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdMs || 0) - (a.createdMs || 0));

  let body = "";

    if (!list.length) body = `<div class="card empty"><span class="big-emo">🗓️</span><b>Nothing in ${monthLabel(S.month)}</b><span>Expenses you add for this month appear here.</span></div>`;
    else { let last = ""; list.forEach(e => { if (e.date !== last) { body += `${last ? "</div>" : ""}<div class="day">${dayLabel(e.date)}</div><div class="group">`; last = e.date; } body += expenseCell(e); }); body += "</div>"; }
  } else body = summaryHtml(exp, total);
  return `
    <div class="monthbar"><button class="round-btn" data-act="month" data-d="-1" aria-label="Previous month"><svg width="10" height="16" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 1 1 7l6 6"/></svg></button>
      <div style="text-align:center"><b>${monthLabel(S.month)}</b><div class="muted small">Total ${aed(total)}</div></div>
      <button class="round-btn" data-act="month" data-d="1" aria-label="Next month"><svg width="10" height="16" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg></button></div>

    <div>${body}</div>`;
}
function summaryHtml(exp, total) {
  const byCat = {};
  exp.forEach(e => { const key = UTILITIES.includes(e.category) ? "__util" : e.category || "other"; byCat[key] = (byCat[key] || 0) + (e.amountF || 0); });
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => { const c = k === "__util" ? { emoji: "💡", label: "Utilities" } : catOf(k); return { label: `${c.emoji} ${c.label}`, v }; });
  const paid = Object.fromEntries(USERS.map(u => [u.id, 0])); exp.forEach(e => { if (paid[e.paidBy] !== undefined) paid[e.paidBy] += e.amountF || 0; });
  const net = balances(S.expenses);
  const max = Math.max(1, ...catRows.map(r => r.v));
  return `<div style="display:flex;flex-direction:column;gap:22px;padding-top:16px">
    <section class="card month-card"><span class="muted small">Total expenses · ${monthLabel(S.month)}</span><span class="total">${aed(total)}</span></section>
    <section><div class="cap">By category</div><div class="group">${catRows.length ? catRows.map(r => `<div class="kv"><span>${esc(r.label)}</span><b>${aed(r.v)}</b></div><div class="bar"><i style="width:${(r.v / max * 100).toFixed(1)}%"></i></div>`).join("") : `<div class="kv muted">No expenses this month</div>`}</div></section>
    <section><div class="cap">Paid by</div><div class="group">${USERS.map(u => `<div class="kv"><span>${esc(u.name)}</span><b>${aed(paid[u.id])}</b></div>`).join("")}</div></section>
    <section><div class="cap">Current balances</div><div class="group">${USERS.map(u => { const v = net[u.id] || 0; return `<div class="kv"><span>${esc(u.name)}</span><b class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : v < 0 ? "−" : ""}${aed(Math.abs(v))}</b></div>`; }).join("")}</div>
      <p class="muted small" style="padding:8px 4px 0">Balances include every month and every payment.</p></section>
  </div>`;
}

const VIEWS = { home: viewHome, expenses: viewExpenses, settings: viewSettings };

/* ============ Add / edit expense ============ */
function openForm(existing) {
  const lastCat = lsGet(LS.cat);
  const F = existing
    ? { ...existing, amount: String((existing.amountF || 0) / 100), participants: (existing.participants || Object.keys(existing.split || {})).slice(), custom: existing.splitMode === "custom", inputs: Object.fromEntries(Object.entries(existing.split || {}).map(([k, v]) => [k, String(v / 100)])) }
    : { id: newId(), amount: "", description: "", category: cats().some(c => c.id === lastCat) ? lastCat : "food", date: todayISO(), paidBy: S.me, participants: USERS.map(u => u.id), custom: false, inputs: {} };
  const sh = openSheet({ title: existing ? "Edit Expense" : "Add Expense", right: "Save" });
  let addingCat = false;
  function draw() {
    sh.body.innerHTML = `
      <div class="amount"><span>AED</span><input id="f-amount" type="text" inputmode="decimal" placeholder="0" value="${esc(F.amount)}" aria-label="Amount in AED" autocomplete="off"></div>
      <input class="inp" id="f-desc" placeholder="What was it for? e.g. Chicken" value="${esc(F.description)}" maxlength="60" autocomplete="off" aria-label="Description">
      <div class="field"><span class="lbl">Category</span>
        <div class="chips">${cats().map(c => `<button class="chip" data-cat="${esc(c.id)}" aria-pressed="${F.category === c.id}">${esc(c.emoji)} ${esc(c.label)}</button>`).join("")}<button class="chip add" data-x="new-cat">＋ Custom</button></div>
        ${addingCat ? `<div class="row2" style="grid-template-columns:72px 1fr auto;display:grid;gap:8px"><input class="inp" id="nc-emoji" placeholder="🙂" maxlength="4" aria-label="Emoji" style="text-align:center"><input class="inp" id="nc-name" placeholder="Category name, e.g. Gas" maxlength="24" aria-label="New category name"><button class="btn primary" data-x="save-cat" style="width:auto">Add</button></div>` : ""}
      </div>
      <div class="field"><span class="lbl">Paid by</span><div class="fixed" id="f-paid"><span>${F.paidBy === S.me ? `You (${esc(nameOf(S.me))})` : esc(nameOf(F.paidBy))}</span></div></div>
      <div class="field"><span class="lbl">Split between <em>${F.custom ? "custom amounts" : "equally"}</em></span>
        <div class="group" id="f-split"></div>
        <div class="group"><label class="who-row" style="cursor:pointer"><span class="cell-main"><span class="cell-title">Custom split</span><span class="cell-sub">Set each person's amount yourself</span></span><span class="toggle"><input type="checkbox" id="f-custom" ${F.custom ? "checked" : ""}><i></i></span></label></div>
        <div class="split-msg" id="f-split-msg"></div>
      </div>
      <div class="field"><span class="lbl">Date</span><input class="inp" id="f-date" type="date" value="${esc(F.date)}" aria-label="Date"></div>
      <p class="err" id="f-err"></p>
      <button class="btn primary" data-x="save">${existing ? "Save changes" : "Save expense"}</button>`;
    drawSplit();
  }
  function compute() {
    const totalF = toF(num(F.amount) || 0), ids = USERS.map(u => u.id).filter(id => F.participants.includes(id));
    if (!F.custom) return { totalF, split: equalSplit(totalF, ids), ok: totalF > 0 && ids.length > 0, ids };
    const split = {}; let sum = 0, bad = false;
    ids.forEach(id => { const v = num(F.inputs[id]); if (v == null || isNaN(v) || v < 0) { bad = bad || (F.inputs[id] !== "" && F.inputs[id] != null); return; } const f = toF(v); if (f > 0) split[id] = f; sum += f; });
    return { totalF, split, sum, bad, ok: totalF > 0 && ids.length > 0 && !bad && sum === totalF, ids };
  }
  function drawSplit() {
    const box = $("#f-split", sh.body), msg = $("#f-split-msg", sh.body); if (!box) return;
    const r = compute();
    box.innerHTML = USERS.map(u => { const on = F.participants.includes(u.id); return `<div class="who-row"><button class="tick ${on ? "on" : ""}" data-part="${u.id}" aria-pressed="${on}" aria-label="Include ${esc(u.name)}">${on ? CHECK : ""}</button><span class="cell-main" data-part="${u.id}"><span class="cell-title">${esc(u.name)}</span></span><span class="share">${!on ? `<span class="muted small">Not included</span>` : F.custom ? `<input type="text" inputmode="decimal" data-in="${u.id}" value="${esc(F.inputs[u.id] ?? "")}" placeholder="0" aria-label="${esc(u.name)}'s amount">` : r.totalF ? aed(r.split[u.id] || 0) : "—"}</span></div>`; }).join("");
    updateMsg(r);
  }
  function updateMsg(r = compute()) {
    const msg = $("#f-split-msg", sh.body); if (!msg) return;
    if (!r.ids.length) { msg.innerHTML = `<span class="neg">Choose at least one person.</span>`; return; }
    if (!F.custom) { msg.innerHTML = r.totalF ? `<span class="muted">${aed(r.split[r.ids[0]] || 0)} each${r.ids.length === 1 ? "" : ` · ${r.ids.length} people`}</span>` : ""; return; }
    if (!r.totalF) { msg.innerHTML = `<span class="muted">Enter the total amount first.</span>`; return; }
    const diff = r.totalF - (r.sum || 0);
    msg.innerHTML = r.bad ? `<span class="neg">Amounts must be numbers.</span>` : diff === 0 ? `<span class="pos">✓ Adds up to ${aed(r.totalF)}</span>` : diff > 0 ? `<span class="neg">${aed(diff)} left to split</span>` : `<span class="neg">${aed(-diff)} too much</span>`;
  }
  sh.body.addEventListener("input", ev => {
    const el = ev.target;
    if (el.id === "f-amount") { F.amount = el.value.replace(/[^\d.,]/g, ""); if (F.amount !== el.value) el.value = F.amount; if (F.custom) updateMsg(); else drawSplitShares(); }
    if (el.id === "f-desc") F.description = el.value;
    if (el.id === "f-date") F.date = el.value;
    if (el.dataset.in) { F.inputs[el.dataset.in] = el.value; updateMsg(); }
  });
  function drawSplitShares() { const r = compute(); sh.body.querySelectorAll("#f-split .who-row").forEach((row, i) => { const id = USERS[i].id, s = row.querySelector(".share"); if (F.participants.includes(id)) s.textContent = r.totalF ? aed(r.split[id] || 0) : "—"; }); updateMsg(r); }
  sh.body.addEventListener("change", ev => {
    if (ev.target.id === "f-custom") {
      F.custom = ev.target.checked;
      if (F.custom) { const r = compute(); F.inputs = {}; const eq = equalSplit(r.totalF, r.ids); r.ids.forEach(id => F.inputs[id] = r.totalF ? String((eq[id] || 0) / 100) : ""); }
      $(".lbl em", sh.body.querySelectorAll(".field")[2]).textContent = F.custom ? "custom amounts" : "equally";
      drawSplit();
    }
  });
  sh.body.addEventListener("click", ev => {
    const t = ev.target.closest("[data-cat],[data-part],[data-x]"); if (!t) return;
    if (t.dataset.cat) { F.category = t.dataset.cat; sh.body.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
    if (t.dataset.part) { const id = t.dataset.part; F.participants = F.participants.includes(id) ? F.participants.filter(x => x !== id) : [...F.participants, id]; if (F.custom && F.inputs[id] == null) F.inputs[id] = ""; drawSplit(); return; }
    const x = t.dataset.x;
    if (x === "new-cat") { addingCat = !addingCat; draw(); const n = $("#nc-name", sh.body); if (n) n.focus(); }
    if (x === "save-cat") {
      const name = ($("#nc-name", sh.body).value || "").trim(), emoji = ($("#nc-emoji", sh.body).value || "").trim() || "🏷️";
      if (!name) { toast("Type a name for the category.", "bad"); return; }
      const existingCat = cats().find(c => c.label.toLowerCase() === name.toLowerCase());
      if (existingCat) F.category = existingCat.id;
      else { const c = { id: "c-" + newId(), label: name, emoji: [...emoji].slice(0, 2).join("") }; S.customCats = [...S.customCats, c]; Store.saveCats(S.customCats).catch(() => toast("Couldn't save the category.", "bad")); F.category = c.id; }
      addingCat = false; draw();
    }
    if (x === "save") save();
  });
  sh.onRight = save;
  function save() {
    const err = $("#f-err", sh.body), amount = num(F.amount);
    const fail = m => { err.textContent = m; err.scrollIntoView({ block: "center", behavior: "smooth" }); };
    if (existing && existing.createdBy !== S.me) return fail(`Only ${shortOf(existing.createdBy)} can change this expense.`);
    if (amount == null) return fail("Enter the amount.");
    if (isNaN(amount) || amount <= 0) return fail("The amount must be more than 0.");
    if (amount > 1000000) return fail("That amount looks too high.");
    if (!validISO(F.date)) return fail("Choose a date.");
    if (F.date > todayISO()) return fail("The date can't be in the future.");
    const r = compute();
    if (!r.ids.length) return fail("Choose who to split with.");
    if (F.custom && r.bad) return fail("The split amounts must be numbers.");
    if (F.custom && r.sum !== r.totalF) return fail(`The split must add up to ${aed(r.totalF)}. ${r.sum < r.totalF ? aed(r.totalF - r.sum) + " is left." : aed(r.sum - r.totalF) + " too much."}`);
    const c = catOf(F.category);
    const obj = {
      type: "expense", amount: r.totalF / 100, amountF: r.totalF, description: String(F.description || "").trim() || c.label,
      category: c.id, date: F.date, paidBy: existing ? existing.paidBy : S.me, participants: r.ids, split: r.split, splitMode: F.custom ? "custom" : "equal",
      createdBy: existing ? existing.createdBy : S.me, createdAt: existing ? existing.createdAt || Store.ts() : Store.ts(),
      updatedBy: S.me, updatedAt: Store.ts(), createdMs: existing ? existing.createdMs || Date.now() : Date.now()
    };
    lsSet(LS.cat, c.id);
    Store.save(F.id, obj)
      .then(() => { if (!existing) notifyOthers({ kind: "expense", id: F.id, amountF: obj.amountF, description: obj.description, emoji: c.emoji, shares: obj.split }); })
      .catch(e => toast(e && e.code === "permission-denied" ? (existing ? "Only the person who added this expense can change it." : "This phone isn't allowed to add expenses. Close Villa 21 and open it again.") : "Couldn't save. Try again.", "bad", 5000));
    SHEETS.slice().forEach(s => s.close());
    toast(S.online || S.demo ? (existing ? "Expense updated" : "Expense added") : "Saved on this phone. It syncs when you're back online.");
  }
  draw();
  if (!existing) { const a = $("#f-amount", sh.body); a.focus({ preventScroll: true }); }
}

/* ============ Details ============ */

      <div class="detail-top"><span class="emo">${pay ? "💸" : esc(c.emoji)}</span><span class="detail-amt">${aed(e.amountF)}</span><b>${pay ? `${esc(nameOf(e.paidBy))} paid ${esc(nameOf(to))}` : esc(e.description)}</b><span class="muted small">${pay ? "Payment" : esc(c.label)} · ${dayLabel(e.date)} ${e.date.slice(0, 4)}</span></div>

      <section><div class="cap">Split ${e.splitMode === "custom" ? "(custom)" : "equally"}</div><div class="group">${USERS.map(u => `<div class="kv"><span>${esc(u.name)}</span>${(e.split || {})[u.id] ? `<b>${aed(e.split[u.id])}</b>` : `<span class="muted small">Not included</span>`}</div>`).join("")}</div></section>`}

/* ============ Mark as paid ============ */
function markPaid(from, to, f) {
  if (from !== S.me && to !== S.me) { toast(`Only ${shortOf(from)} or ${shortOf(to)} can mark this as paid.`, "bad"); return; }
  const text = from === S.me ? `You paid ${esc(nameOf(to))} <b>${aed(f)}</b>.` : `${esc(nameOf(from))} paid you <b>${aed(f)}</b>.`;
  confirmSheet("Mark as paid?", `${text} This clears that debt for everyone.`, "Mark as paid", false, () => {
    const id = newId();
    Store.save(id, { type: "payment", amount: f / 100, amountF: f, description: "Payment", category: "payment", date: todayISO(), paidBy: from, participants: [to], split: { [to]: f }, splitMode: "custom", createdBy: S.me, createdAt: Store.ts(), updatedBy: S.me, updatedAt: Store.ts(), createdMs: Date.now() })
      .then(() => notifyOthers({ kind: "payment", id, from, to, amountF: f }))
      .catch(e => toast(e && e.code === "permission-denied" ? "Only the two people in a payment can record it." : "Couldn't save the payment. Try again.", "bad", 5000));
    toast(`${shortOf(from)} → ${shortOf(to)} marked as paid`);
  });
}

/* ============ Villa code ============ */
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const cleanCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^V21/, "");
const prettyCode = c => c.match(/.{1,4}/g).join("-");
function makeCode() { const a = new Uint32Array(20); crypto.getRandomValues(a); return Array.from(a, n => CODE_CHARS[n % CODE_CHARS.length]).join(""); }
function shareCode() {
  const url = location.origin + location.pathname;
  const text = `Join Villa 21 💸\n\n1. Open this link in Safari: ${url}\n2. Tap Share → Add to Home Screen (turn on "Open as Web App")\n3. Open Villa 21 and paste this code:\n\n${prettyCode(S.code)}`;
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else navigator.clipboard.writeText(text).then(() => toast("Invite copied"), () => toast(prettyCode(S.code)));
}

/* ============ Events ============ */
const ACT = {
  "add": () => openForm(null),
  "detail": b => openDetail(b.dataset.id),
  "mark-paid": b => markPaid(b.dataset.from, b.dataset.to, +b.dataset.f),
  "go-month": () => { S.month = monthOf(todayISO()); S.expTab = "list"; go("expenses"); },
  "month": b => { S.month = shiftMonth(S.month, +b.dataset.d); render(); },
  "exp-tab": b => { S.expTab = b.dataset.v; render(); },
  "pick-user": b => pickUser(b.dataset.id),
  "push-on": () => enablePush(),
  "push-off": () => disablePush(),
  "push-test": () => testPush(),
  "push-later": () => { lsSet(LS.pushBanner, "1"); render(); },
  "theme": b => { const v = b.dataset.v; lsSet(LS.theme, v === "system" ? null : v); if (v === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); render(); },
  "share-code": () => shareCode(),
  "demo": () => startDemo(),
  "paste": async () => { try { const t = await navigator.clipboard.readText(); $("#codeInp").value = t.trim(); } catch (e) { toast("Tap the box and choose Paste instead."); } },
  "create": () => confirmSheet("Create Villa 21?", "Only do this once, on the first phone. TM and Rafi then join with the code you send them.", "Create", false, async () => {
    const code = makeCode();
    try { await Store.create(code); S.code = code; lsSet(LS.code, code); await Store.listen(); await settleIdentity(); toast("Villa 21 created. Choose who you are, then send the code from Settings."); }
    catch (e) { toast(navigator.onLine ? "Couldn't create the villa. Check the Firebase setup." : "You need internet to create the villa.", "bad", 5000); }
  })
};
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) { go(tab.dataset.to); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-act][role=button]")) ACT[e.target.dataset.act](e.target); });
document.addEventListener("submit", async e => {
  if (e.target.id !== "joinForm") return;
  e.preventDefault();
  const code = cleanCode($("#codeInp").value), err = $("#joinErr"), btn = e.target.querySelector("[type=submit]");
  if (code.length !== 20) { err.textContent = "That doesn't look like a Villa 21 code. It has 20 letters and numbers."; return; }
  btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
  try {
    if (!(await Store.check(code))) { err.textContent = "No Villa 21 found with that code. Check it and try again."; btn.disabled = false; btn.textContent = "Join Villa 21"; return; }
    S.code = code; lsSet(LS.code, code); await Store.listen(); await settleIdentity();
  } catch (ex) {
    err.textContent = navigator.onLine ? "Couldn't check the code. Make sure Villa 21 is set up in Firebase, then try again." : "You need internet to join the first time.";
    btn.disabled = false; btn.textContent = "Join Villa 21";
  }
});

/* ============ Start ============ */
async function boot() {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  let cfg = null;
  try { const m = await import("./config.js"); cfg = m.firebaseConfig; PUSH = m.pushConfig && m.pushConfig.url && m.pushConfig.key ? m.pushConfig : null; } catch (e) {}
  if (!cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey + cfg.projectId)) { S.phase = "setup"; render(); return; }
  try { await startFirebase(cfg); }
  catch (e) { $("#main").innerHTML = `<div class="onb"><div class="onb-head"><img class="badge lg" src="logo.png" alt="Villa 21 logo"><p class="muted">Villa 21 couldn't load. Check your internet connection and open it again.</p></div></div>`; return; }
  if (!S.code) { S.phase = "join"; render(); return; }
  Store.listen().catch(() => {});
  await settleIdentity();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.phase === "app") refreshPushState(); });
boot();
</script>
</body>
</html>
